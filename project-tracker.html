        }

        .container {
            max-width: 1400px;

            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
            font-weight: 300;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .refresh-btn, .filter-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        .filter-btn {
            background: #2196F3;
        }

        .filter-btn.active {
            background: #1976D2;
        }

        .refresh-btn:hover {
            background: #45a049;
        }

        .filter-btn:hover {
            background: #1976D2;
        }

        .search-box {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            min-width: 250px;
        }

        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .project-card {
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            background: #fafafa;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .project-title {
            font-size: 1.4em;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 5px;
        }

        .project-path {
            color: #666;
            font-size: 0.85em;
            margin-bottom: 10px;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            background: #f0f0f0;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .project-description {
            color: #555;
            margin-bottom: 15px;
            line-height: 1.4;
            font-size: 0.95em;
        }

        .project-info {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }

        .info-item {
            background: white;
            padding: 8px 12px;
            border-radius: 5px;
            border-left: 3px solid #667eea;
            font-size: 0.9em;
        }

        .info-label {
            font-weight: bold;
            color: #333;
            font-size: 0.8em;
        }

        .info-value {
            color: #666;
            font-size: 0.85em;
            margin-top: 2px;
        }

        .project-tags {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .tag {
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: 500;
        }

        .tag.production { background: #4CAF50; }
        .tag.development { background: #FF9800; }
        .tag.research { background: #9C27B0; }
        .tag.archived { background: #757575; }
        .tag.ai { background: #2196F3; }
        .tag.quantum { background: #E91E63; }
        .tag.web { background: #00BCD4; }

        .project-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8em;
            transition: background 0.2s;
        }

        .open-folder {
            background: #2196F3;
            color: white;
        }

        .open-folder:hover {
            background: #1976D2;
        }

        .view-readme {
            background: #FF9800;
            color: white;
        }

        .view-readme:hover {
            background: #F57C00;
        }

        .copy-path {
            background: #9C27B0;
            color: white;
        }

        .copy-path:hover {
            background: #7B1FA2;
        }
        .claude-btn {
            background: #4CAF50;
            color: white;
        }
        .claude-btn:hover {
            background: #45a049;
        }
        .venv-btn {
            background: #FF5722;
            color: white;
        }
        .venv-btn:hover {
            background: #E64A19;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;

        .stat-item {
            text-align: center;
            padding: 10px;
            background: white;
            border-radius: 8px;

            font-size: 2em;
            font-weight: bold;

            color: #666;
            font-size: 0.9em;
            margin-top: 5px;

            text-align: center;
            padding: 40px;
            color: #666;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #666;
            font-style: italic;

                grid-template-columns: 1fr;
            }

        function renderProjects() {
            const projectsContainer = document.getElementById('projects');
            const noResultsDiv = document.getElementById('noResults');
            
            if (filteredProjects.length === 0) {
                projectsContainer.innerHTML = '';
                noResultsDiv.style.display = 'block';
                return;
            }

            noResultsDiv.style.display = 'none';
            
            projectsContainer.innerHTML = filteredProjects.map(project => `
                <div class="project-card">
                    <div class="project-title">${project.name}</div>
                    <div class="project-path">${project.path}</div>
                    <div class="project-description">${project.description}</div>
                    
                    <div class="project-tags">
                        ${project.tags.map(tag => `<span class="tag ${tag}">${tag}</span>`).join('')}
                    </div>
                    
                    <div class="project-info">
                        <div class="info-item">
                            <div class="info-label">Status</div>
                            <div class="info-value">${project.status}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Category</div>
                            <div class="info-value">${project.category}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Technologies</div>
                            <div class="info-value">${project.technologies}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">README</div>
                            <div class="info-value">${project.hasReadme ? '✅ Yes' : '❌ No'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">CLAUDE.md</div>
                            <div class="info-value">${project.hasClaude === true ? '🤖 Yes' : (project.hasClaude === false ? '❌ No' : '❓ Unknown')}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Virtual Env</div>
                            <div class="info-value">${project.hasVenv === true ? '🐍 Yes' : (project.hasVenv === false ? '❌ No' : '❓ Unknown')}</div>
                        </div>
                    </div>
                    
                    <div class="project-actions">
                        <button class="action-btn open-folder" onclick="openFolder('${project.path}')">📁 Open</button>
                        ${project.hasReadme ? `<button class="action-btn view-readme" onclick="viewReadme('${project.path}')">📄 README</button>` : ''}
                        ${project.hasClaude === true ? `<button class="action-btn claude-btn" onclick="launchClaude('${project.path}')">🤖 Claude</button>` : ''}
                        ${project.hasVenv === true ? `<button class="action-btn venv-btn" onclick="activateVenv('${project.path}')">🐍 Activate</button>` : ''}
                        <button class="action-btn copy-path" onclick="copyPath('${project.path}')">📋 Copy</button>
                    </div>
                </div>
            `).join('');
        }

        function filterProjects() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            filteredProjects = projectsData.filter(project => {
                const matchesSearch = searchTerm === '' || 
                    project.name.toLowerCase().includes(searchTerm) ||
                    project.description.toLowerCase().includes(searchTerm) ||
                    project.technologies.toLowerCase().includes(searchTerm) ||
                    project.category.toLowerCase().includes(searchTerm);
                
                const matchesFilter = currentFilter === 'all' || 
                    project.tags.includes(currentFilter) ||
                    (currentFilter === 'production' && project.status === 'Production') ||
                    (currentFilter === 'development' && project.status === 'Development');
                
                return matchesSearch && matchesFilter;
            });
            
            renderProjects();
            updateStats();
        }

        function toggleFilter(filter) {
            // Update active filter button
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-filter="${filter}"]`).classList.add('active');
            
            currentFilter = filter;
            filterProjects();
        }

        function updateStats() {
            const stats = {
                total: filteredProjects.length,
                production: filteredProjects.filter(p => p.status === 'Production').length,
                development: filteredProjects.filter(p => p.status === 'Development').length,
                ai: filteredProjects.filter(p => p.tags.includes('ai')).length,
                quantum: filteredProjects.filter(p => p.tags.includes('quantum')).length,
                web: filteredProjects.filter(p => p.tags.includes('web')).length
            };

            document.getElementById('totalProjects').textContent = stats.total;
            document.getElementById('productionProjects').textContent = stats.production;
            document.getElementById('developmentProjects').textContent = stats.development;
            document.getElementById('aiProjects').textContent = stats.ai;
            document.getElementById('quantumProjects').textContent = stats.quantum;
            document.getElementById('webProjects').textContent = stats.web;
        }

        function openFolder(path) {
            const button = event.target;
            const originalText = button.textContent;
            
            // Copy the path and provide instructions
            let command;
            if (navigator.userAgent.includes('Windows')) {
                command = `explorer "${path.replace(/\//g, '\\')}"`;
            } else if (navigator.userAgent.includes('Mac')) {
                command = `open "${path}"`;
            } else {
                command = `xdg-open "${path}"`;
            }
            
            // Try to open with file:// protocol first (may work in some browsers)
            try {
                if (navigator.userAgent.includes('Windows')) {
                    window.open(`file:///${path.replace(/\//g, '\\')}`);
                } else {
                    window.open(`file://${path}`);
                }
            } catch (error) {
                // If that fails, copy command to clipboard
                navigator.clipboard.writeText(command).then(() => {
                    button.textContent = '📋 Command Copied!';
                    button.style.background = '#45a049';
                    setTimeout(() => {
                        button.textContent = originalText;
                        button.style.background = '#2196F3';
                    }, 2000);
                }).catch(() => {
                    alert(`To open folder, run: ${command}`);
                });
            }
        }

        function viewReadme(path) {
            window.open(`file://${path}/README.md`);
        }

        function copyPath(path) {
            navigator.clipboard.writeText(path).then(() => {
                const button = event.target;
                const originalText = button.textContent;
                button.textContent = '✅ Copied!';
                button.style.background = '#4CAF50';
                
                setTimeout(() => {
                    button.textContent = originalText;
                    button.style.background = '#9C27B0';
                }, 2000);
            }).catch(() => {
                alert('Path copied to clipboard: ' + path);
            });
        }

        function launchClaude(path) {
            // For now, show a notification with the command
            // In the future, this will integrate with a backend service
            const command = `cd "${path}" && claude --continue`;
            
            const button = event.target;
            const originalText = button.textContent;
            button.textContent = '🚀 Launching...';
            button.style.background = '#45a049';
            
            // Copy command to clipboard for now
            navigator.clipboard.writeText(command).then(() => {
                setTimeout(() => {
                    button.textContent = '📋 Copied!';
                    setTimeout(() => {
                        button.textContent = originalText;
                        button.style.background = '#4CAF50';
                    }, 1500);
                }, 500);
            }).catch(() => {
                alert(`Command copied to clipboard: ${command}`);
                setTimeout(() => {
                    button.textContent = originalText;
                    button.style.background = '#4CAF50';
                }, 2000);
            });
        }

        function activateVenv(path) {
            // For now, show the activation command
            // In the future, this will integrate with a backend service
            const commands = [
                `cd "${path}"`,
                `source venv/bin/activate`,  // Linux/Mac
                `# Or on Windows: venv\\Scripts\\activate`
            ];
            const command = commands.join(' && ');
            
            const button = event.target;
            const originalText = button.textContent;
            button.textContent = '🔄 Activating...';
            button.style.background = '#E64A19';
            
            // Copy command to clipboard for now
            navigator.clipboard.writeText(command).then(() => {
                setTimeout(() => {
                    button.textContent = '📋 Copied!';
                    setTimeout(() => {
                        button.textContent = originalText;
                        button.style.background = '#FF5722';
                    }, 1500);
                }, 500);
            }).catch(() => {
                alert(`Command copied to clipboard: ${command}`);
                setTimeout(() => {
                    button.textContent = originalText;
                    button.style.background = '#FF5722';
                }, 2000);
            });
        }

        function refreshProjects() {
            const loadingDiv = document.getElementById('loading');
            const projectsContainer = document.getElementById('projects');
            
            loadingDiv.style.display = 'block';
            projectsContainer.innerHTML = '';
            
            setTimeout(() => {
                loadingDiv.style.display = 'none';
                filterProjects();
            }, 1000);
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', () => {
            // Set initial active filter
            toggleFilter('all');
        });

        // Add keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'r') {
                e.preventDefault();
                refreshProjects();
            }
        });
    </script>
</body>
</html>
