name: AWS Deployment CI/CD

on:
  push:
    branches: [ aws-deployment ]
  pull_request:
    branches: [ aws-deployment ]

env:
  NODE_VERSION: '18'

jobs:
  test:
    name: Test & Validate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
          
      - name: Install backend dependencies
        run: |
          cd server
          npm ci
          
      - name: Run backend tests
        run: |
          cd server
          npm test || echo "No tests configured yet"
          
      - name: Validate HTML files
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: ./
          css: true
          
      - name: Test Docker build
        run: |
          docker build -t project-tracker-aws:test .
          
  lint:
    name: Lint & Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          
      - name: Check file structure
        run: |
          echo "Checking required files for AWS deployment..."
          test -f amplify.yml && echo "✅ amplify.yml found" || exit 1
          test -f Dockerfile && echo "✅ Dockerfile found" || exit 1
          test -f .env.aws && echo "✅ .env.aws found" || exit 1
          test -f project-tracker.html && echo "✅ Frontend files found" || exit 1
          
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Run npm audit
        run: |
          cd server
          npm audit --audit-level moderate
          
      - name: Scan Docker image for vulnerabilities
        run: |
          docker build -t project-tracker-aws:security-scan .
          # Add Trivy or similar security scanner here if desired
          
  deploy-validation:
    name: Validate Deployment Config
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Test production build
        run: |
          cd server
          npm ci
          NODE_ENV=production PORT=8080 HOST=0.0.0.0 timeout 30s npm start &
          sleep 10
          curl -f http://localhost:8080/api/health || exit 1
          echo "✅ Production server starts successfully"
          
      - name: Validate Amplify configuration
        run: |
          echo "Validating amplify.yml structure..."
          # Basic YAML validation
          python3 -c "import yaml; yaml.safe_load(open('amplify.yml'))" && echo "✅ Valid YAML" || exit 1
          
      - name: Environment validation
        run: |
          echo "Checking environment configuration..."
          test -f .env.aws && echo "✅ AWS environment config present" || exit 1
          
  notify:
    name: Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-validation]
    if: always()
    
    steps:
      - name: Success notification
        if: ${{ needs.deploy-validation.result == 'success' }}
        run: |
          echo "🚀 AWS deployment branch is ready!"
          echo "Next steps:"
          echo "1. Push this branch to GitHub"
          echo "2. Connect to AWS Amplify"  
          echo "3. Configure custom domain in Route 53"
          
      - name: Failure notification  
        if: ${{ needs.deploy-validation.result != 'success' }}
        run: |
          echo "❌ AWS deployment validation failed"
          echo "Check the logs above for issues"